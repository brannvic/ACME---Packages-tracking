services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-acme}
      POSTGRES_USER: ${DB_USER:-acme}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-acme_desarrollo}
    volumes:
      - acme_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-acme}
      DB_USER: ${DB_USER:-acme}
      DB_PASSWORD: ${DB_PASSWORD:-acme_desarrollo}
      JWT_SECRET: ${JWT_SECRET:-acme-secreto-solo-para-desarrollo-cambiar}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-AcmeDemo2026!}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  acme_datos:
